<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositorio de Test de Examen</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --badge-bg: #eff6ff;
      --badge-text: #1e40af;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --badge-bg: #1e3a8a;
        --badge-text: #bfdbfe;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    input[type="search"], select {
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }

    input[type="search"] { flex: 1 1 260px; }
    select { flex: 0 1 220px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      margin-bottom: 0.5rem;
    }

    .card h2 { font-size: 1.05rem; margin-bottom: 0.35rem; }
    .meta { font-size: 0.85rem; color: var(--muted); }

    .btn {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .btn:hover { background: var(--accent-hover); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Banco de Test para Exámenes</h1>
      <p class="subtitle">Selecciona un cuestionario o filtra por bloque temático.</p>
    </header>

    <section class="controls" aria-label="Filtros de búsqueda">
      <input type="search" id="searchInput" placeholder="Buscar por título o tema...">
      <select id="categoryFilter" aria-label="Filtrar por categoría">
        <option value="all">Todas las categorías</option>
      </select>
    </section>

    <main id="testGrid" class="grid"></main>

    <footer>
      <span id="counter"></span>
    </footer>
  </div>

  <script>
    // =========================================================================
    // CONFIGURACIÓN: Añade aquí cada nuevo test.
    // Usa rutas relativas exactas (respetando mayúsculas y minúsculas).
    // =========================================================================
    const TESTS = [
      {
        titulo: "UD1 - Conceptos Fundamentales",
        categoria: "Bloque 1",
        descripcion: "Batería de repaso con retroalimentación inmediata.",
        preguntas: 50,
        archivo: "./tests/ud1-conceptos.html"
      },
      {
        titulo: "UD2 - Procedimientos y Normativa",
        categoria: "Bloque 1",
        descripcion: "Casos prácticos y normativa aplicable.",
        preguntas: 40,
        archivo: "./tests/ud2-normativa.html"
      },
      {
        titulo: "Simulacro General - Convocatoria",
        categoria: "Simulacros",
        descripcion: "Examen completo cronometrado de todos los temas.",
        preguntas: 100,
        archivo: "./tests/simulacro-01.html"
      }
    ];

    const grid = document.getElementById("testGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const counter = document.getElementById("counter");

    // Poblar selector de categorías automáticamente
    const categories = [...new Set(TESTS.map(t => t.categoria))].sort();
    categories.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categoryFilter.appendChild(opt);
    });

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedCat = categoryFilter.value;

      const filtered = TESTS.filter(t => {
        const matchesCat = selectedCat === "all" || t.categoria === selectedCat;
        const matchesText =
          t.titulo.toLowerCase().includes(query) ||
          t.descripcion.toLowerCase().includes(query) ||
          t.categoria.toLowerCase().includes(query);
        return matchesCat && matchesText;
      });

      grid.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No se encontraron test con esos criterios.";
        grid.appendChild(empty);
      } else {
        filtered.forEach(t => {
          const card = document.createElement("article");
          card.className = "card";

          const top = document.createElement("div");

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = t.categoria;

          const title = document.createElement("h2");
          title.textContent = t.titulo;

          const desc = document.createElement("p");
          desc.className = "meta";
          desc.textContent = `${t.descripcion}${t.preguntas ? ` (${t.preguntas} preguntas)` : ""}`;

          top.append(badge, title, desc);

          const link = document.createElement("a");
          link.className = "btn";
          link.href = t.archivo;
          link.textContent = "Abrir test";

          card.append(top, link);
          grid.appendChild(card);
        });
      }

      counter.textContent = `Mostrando ${filtered.length} de ${TESTS.length} test disponibles.`;
    }

    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
